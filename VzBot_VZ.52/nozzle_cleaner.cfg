#########################################
# Enable Nozzle wipe stepper
#########################################

########################################
# Fly DP5
########################################
[manual_stepper cleaner_stepper]
step_pin: dp:PC15
dir_pin: dp:PC14
enable_pin: !dp:PC2
microsteps: 16
rotation_distance: 1150
velocity: 400
accel: 8500
homing_speed: 40
endstop_pin: dp:PB4
position_endstop: 0

[tmc2209 manual_stepper cleaner_stepper]
interpolate: true
uart_pin: dp:PC13
run_current: 0.63
hold_current: 0.4
sense_resistor: 0.110


#########################################
# Toggle Nozzle Cleaner Stepper
#########################################
[gcode_macro TOGGLE_NOZZLE_STEPPER]
description: Toggles the nozzle stepper on or off
gcode:
    {% set current = printer["gcode_macro SET_NOZZLE_STEPPER_ENABLED"].enabled|int %}
    {% set new_state = 0 if current == 1 else 1 %} 
    SET_NOZZLE_STEPPER_ENABLED ENABLED={new_state}
    RESPOND MSG="Nozzle cleaner {% if new_state == 1 %}ENABLED{% else %}DISABLED{% endif %}"


[gcode_macro SET_NOZZLE_STEPPER_ENABLED]
variable_enabled: 0
gcode:
    {% set enabled = params.ENABLED|int %}
    RESPOND MSG="Nozzle stepper {% if enabled == 1 %}ENABLED{% else %}DISABLED{% endif %}"
    G4 P200
    {% set nozzle_stepper_enabled = printer["gcode_macro SET_NOZZLE_STEPPER_ENABLED"].enabled|int %}

    {% if enabled != nozzle_stepper_enabled %}
        SET_GCODE_VARIABLE MACRO=SET_NOZZLE_STEPPER_ENABLED VARIABLE=enabled VALUE={enabled}
        {% if enabled == 1 %}
            MANUAL_STEPPER STEPPER=cleaner_stepper ENABLE=1
            MANUAL_STEPPER STEPPER=cleaner_stepper MOVE=-800 STOP_ON_ENDSTOP=1 SPEED=60
            MANUAL_STEPPER STEPPER=cleaner_stepper SET_POSITION=0
        {% else %}
            MANUAL_STEPPER STEPPER=cleaner_stepper MOVE=0
            MANUAL_STEPPER STEPPER=cleaner_stepper ENABLE=0
        {% endif %}
    {% endif %}

[gcode_macro HOME_CLEANER]
description: Homes and parks the nozzle cleaner stepper
gcode:
    MANUAL_STEPPER STEPPER=cleaner_stepper ENABLE=1
    MANUAL_STEPPER STEPPER=cleaner_stepper MOVE=-800 STOP_ON_ENDSTOP=1 SPEED=60
    MANUAL_STEPPER STEPPER=cleaner_stepper SET_POSITION=0
    MANUAL_STEPPER STEPPER=cleaner_stepper MOVE=0 SPEED=100
    MANUAL_STEPPER STEPPER=cleaner_stepper ENABLE=0
    RESPOND MSG="Cleaner stepper homed and parked"

##########################################
# Nozzle wipe
##########################################

[gcode_macro CLEAN_NOZZLE]
description: Cleans nozzle with brush; includes stepper homing, Z safety, and restore
variable_start_x: 307             # X center of brush
variable_start_y: 97 
variable_finish_x: 320            # X center of brush
variable_finish_y: 140            # Y center of brush
variable_start_z: 20              # Z height of brush
variable_wipe_dist_y: 14.5        # Y wipe ± distance
variable_wipe_dist_x: 0           # X wipe distance
variable_wipe_qty: 3              # Number of wipes
variable_wipe_spd: 60             # Wipe speed (mm/s)
variable_retract_length: 1        # Retraction distance
variable_unretract_length: 0.5    # Unretraction distance
variable_cleaner_pos: 424         # Stepper brush position (engaged)
gcode:
    SAVE_GCODE_STATE NAME=clean_nozzle_state

    {% set travel_speed = printer.toolhead.max_velocity * 60 | float %}
    {% set current_z = printer.toolhead.position.z %}
    {% set action = params.ACTION|default("CHECK")|upper %}

    RESPOND MSG="🧹 Starting nozzle cleaning sequence..."

    # --- Enable and home cleaner stepper ---
    MANUAL_STEPPER STEPPER=cleaner_stepper ENABLE=1
    MANUAL_STEPPER STEPPER=cleaner_stepper MOVE=-800 STOP_ON_ENDSTOP=1 SPEED=60
    MANUAL_STEPPER STEPPER=cleaner_stepper SET_POSITION=0
    G4 P300
    RESPOND MSG="Cleaner stepper homed and set to position 0"

        # --- Move to brush position ---
    G90
    G1 X{finish_x} Y{finish_y} F{travel_speed}

    # --- Z safety check and move ---
    {% if current_z < start_z %}
        {% set saved_z = current_z %}
        G1 Z{start_z} F1500
        RESPOND MSG="Z abovee {start_z}mm: moved down and saved Z={saved_z|round(2)}mm"
    {% else %}
        {% set saved_z = None %}
        RESPOND MSG="Z already below {start_z}mm: no move needed"
    {% endif %}

    # --- Lower wipe then start wipe action ---
    MANUAL_STEPPER STEPPER=cleaner_stepper MOVE={cleaner_pos} SYNC=0
    RESPOND MSG="Cleaner stepper moved to engaged position ({cleaner_pos})"
    G4 P1000
    G1 X{start_x} Y{start_y} F{travel_speed}

    # --- Perform wiping motions ---
    {% for n in range(wipe_qty) %}
        G1 X{start_x + wipe_dist_x} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - wipe_dist_x} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x + wipe_dist_x} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - wipe_dist_x} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
    {% endfor %}

    # --- Retract and reset manual stepper ---
    G90
    G1 X{finish_x} Y{finish_y} F{travel_speed}
    MANUAL_STEPPER STEPPER=cleaner_stepper MOVE=0 SYNC=0
    SET_NOZZLE_STEPPER_ENABLED ENABLED=0

    # --- Restore Z if it was saved ---
    {% if saved_z != none %}
        G90
        G1 Z{saved_z} F600
        RESPOND MSG="Z restored to {saved_z|round(2)}mm"
    {% else %}
        RESPOND MSG="No Z restore needed (already below {start_z}mm)"
    {% endif %}
    # --- Restore main printer state first (avoids coordinate/mode issues) ---
    RESTORE_GCODE_STATE NAME=clean_nozzle_state
    
    RESPOND MSG="Nozzle cleaning sequence complete"
    
[gcode_macro CLEAN_NOZZLE_RETRACT]
description: Cleans nozzle with brush; includes stepper homing, retraction, Z safety, and restore
variable_start_x: 307             # X center of brush
variable_start_y: 97 
variable_finish_x: 320            # X center of brush
variable_finish_y: 140            # Y center of brush
variable_start_z: 20              # Z height of brush
variable_wipe_dist_y: 14.5        # Y wipe ± distance
variable_wipe_dist_x: 0           # X wipe distance
variable_wipe_qty: 1              # Number of wipes
variable_wipe_spd: 60             # Wipe speed (mm/s)
variable_retract_length: 1        # Retraction distance
variable_unretract_length: 0.5    # Unretraction distance
variable_cleaner_pos: 424         # Stepper brush position (engaged)
gcode:

    {% set travel_speed = printer.toolhead.max_velocity * 60 | float %}
    {% set current_z = printer.toolhead.position.z %}
    {% set action = params.ACTION|default("CHECK")|upper %}

    RESPOND MSG="🧹 Starting nozzle cleaning sequence..."

    # --- Enable and home cleaner stepper ---
    MANUAL_STEPPER STEPPER=cleaner_stepper ENABLE=1
    MANUAL_STEPPER STEPPER=cleaner_stepper MOVE=-800 STOP_ON_ENDSTOP=1 SPEED=60
    MANUAL_STEPPER STEPPER=cleaner_stepper SET_POSITION=0
    G4 P300
    RESPOND MSG="Cleaner stepper homed and set to position 0"
    
    # --- Move to brush position ---
    G90
    G1 X{finish_x} Y{finish_y} F{travel_speed}

    # --- Z safety check and move ---
    {% if current_z < start_z %}
        {% set saved_z = current_z %}
        G1 Z{start_z} F1500
        RESPOND MSG="Z abovee {start_z}mm: moved down and saved Z={saved_z|round(2)}mm"
    {% else %}
        {% set saved_z = None %}
        RESPOND MSG="Z already below {start_z}mm: no move needed"
    {% endif %}

    # --- Lower wipe then start wipe action ---
    MANUAL_STEPPER STEPPER=cleaner_stepper MOVE={cleaner_pos} SYNC=0
    G4 P1000
    G1 X{start_x} Y{start_y} F{travel_speed}

    # --- Retract before wiping ---
    G91 E                      ; Relative extrusion only
    G1 E-{retract_length} F1800
    G90 E                      ; Restore absolute extrusion

    # --- Perform wiping motions ---
    G90                        ; Ensure absolute XY mode
    {% for n in range(wipe_qty) %}
        G1 X{start_x + wipe_dist_x} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - wipe_dist_x} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x + wipe_dist_x} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - wipe_dist_x} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x + wipe_dist_x} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - wipe_dist_x} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x + wipe_dist_x} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - wipe_dist_x} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x + wipe_dist_x} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - wipe_dist_x} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x + wipe_dist_x} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - wipe_dist_x} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
        G4 P500
    {% endfor %}

    # --- Unretract after wiping ---
    G91 E
    G1 E{unretract_length} F1800
    G90 E

    # --- Move away from brush ---
    G90
    G1 X{finish_x} Y{finish_y} F{travel_speed}

    # --- Disable stepper (optional) ---
    MANUAL_STEPPER STEPPER=cleaner_stepper MOVE=0 SYNC=0
    SET_NOZZLE_STEPPER_ENABLED ENABLED=0

    # --- Restore Z height if changed ---
    {% if saved_z is not none %}
        G1 Z{saved_z} F600
        RESPOND MSG="Z restored to {saved_z|round(2)}mm"
    {% else %}
        RESPOND MSG="No Z restore needed"
    {% endif %}

    RESPOND MSG="✅ Nozzle cleaning sequence complete"
