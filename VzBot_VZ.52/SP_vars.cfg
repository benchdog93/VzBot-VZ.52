#=====================================
# VZ-Bot Vz.52 Smart Purge Variables
#=====================================

# --- Smart Purge Variables Macro ---
[gcode_macro SP_Variables]
variable_same_color: 70
variable_light_to_dark: 275 
variable_dark_to_light: 420
variable_default: 275
gcode:

[gcode_macro DUMP_SP_VARS]
gcode:
    {action_respond_info(
        "SP_Variables works!\n" ~
        "same_color     → " ~ printer["gcode_macro SP_Variables"].same_color ~ "\n" ~
        "light_to_dark  → " ~ printer["gcode_macro SP_Variables"].light_to_dark ~ "\n" ~
        "dark_to_light  → " ~ printer["gcode_macro SP_Variables"].dark_to_light ~ "\n" ~
        "default        → " ~ printer["gcode_macro SP_Variables"].default
    )}

# --- One-time initializer macro ----
# --- Run this macro exactly once to create/populate the variables file ---

[gcode_macro INITIALIZE_GLOBALS]
description: Initialize smart purge variables (lowercase, Klipper-safe)
gcode:
  M117 INITIALIZING GLOBALS...

  # --- Tool → Color assignments (your provided defaults) ---
  SAVE_VARIABLE VARIABLE=t0_color  VALUE='"black"'
  SAVE_VARIABLE VARIABLE=t1_color  VALUE='"white"'
  SAVE_VARIABLE VARIABLE=t2_color  VALUE='"lime"'
  SAVE_VARIABLE VARIABLE=t3_color  VALUE='"red"'
  SAVE_VARIABLE VARIABLE=t4_color  VALUE='"chocolate"'
  SAVE_VARIABLE VARIABLE=t5_color  VALUE='"orange"'
  SAVE_VARIABLE VARIABLE=t6_color  VALUE='"silver"'
  SAVE_VARIABLE VARIABLE=t7_color  VALUE='"yellow"'
  SAVE_VARIABLE VARIABLE=t8_color  VALUE='"purple"'
  SAVE_VARIABLE VARIABLE=t9_color  VALUE='"green"'
  SAVE_VARIABLE VARIABLE=t10_color VALUE='"blue"'

  # --- Your full color list ---
  SAVE_VARIABLE VARIABLE=colors_list VALUE='"black,white,grey,red,blue,green,yellow,orange,purple,silver,gold,pink,chocolate,lime,marble"'

  # --- Lane left open / unassigned ---
  SAVE_VARIABLE VARIABLE=lane_open VALUE='""'

  # --- Previous / next color tracking ---
  SAVE_VARIABLE VARIABLE=last_used_color VALUE='""'
  SAVE_VARIABLE VARIABLE=last_used_tool  VALUE='""'

  M117 GLOBALS INITIALIZED


[gcode_macro VERIFY_GLOBALS]
description: Verify smart-purge variables and display values
gcode:
  M117 VERIFY GLOBALS...

  {% set svv = printer.save_variables.variables %}
  {% set tool_vars = [
      "t0_color","t1_color","t2_color","t3_color","t4_color",
      "t5_color","t6_color","t7_color","t8_color","t9_color","t10_color"
  ] %}

  # Missing variables
  {% for v in tool_vars %}
    {% if v not in svv %}
      {% set msg = "MISSING: " ~ v %}
      M117 {msg}
    {% endif %}
  {% endfor %}

  # Color mappings
  M117 TOOL COLOR MAP...
  {% for v in tool_vars %}
    {% set msg = v ~ " = " ~ svv.get(v, "<<MISSING>>") %}
    M117 {msg}
  {% endfor %}

  # Global values
  M117 GLOBAL VALUES...

  {% set msg = "colors_list = " ~ svv.get("colors_list","<<MISSING>>") %}
  M117 {msg}

  {% set msg = "lane_open = " ~ svv.get("lane_open","<<MISSING>>") %}
  M117 {msg}

  {% set msg = "last_used_tool = " ~ svv.get("last_used_tool","<<MISSING>>") %}
  M117 {msg}

  {% set msg = "last_used_color = " ~ svv.get("last_used_color","<<MISSING>>") %}
  M117 {msg}

  M117 VERIFY COMPLETE


