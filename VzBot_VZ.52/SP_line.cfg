
#-------------------------------------
# VZ-Bot Vz.52 Smart Purge 
#-------------------------------------

[gcode_macro SMART_PURGE]
description: Smart purge that uses short/long amounts based on previous color
gcode:
    {% set tracker = printer["gcode_macro _TOOLCHANGE_TRACKER"] %}
    {% set count = tracker.total_toolchanges|default(0)|int %}
    M117 Toolchanges so far: {count}

    # 1. --- Single-color print → normal long prime line (your existing behaviour) ---
    {% if count == 0 %}
        M117 Single-color → full purge line
        PURGE_LINE

    # 2. --- Multi-color print → decide purge amount by previous color ---
    {% else %}
        {% set svars = printer.save_variables.variables %}

        # --- Current tool that just got picked ---
        {% set current_tool = printer.toolhead.extruder %}               # e.g. "extruder" or "extruder3"
        {% set current_tool_num = current_tool|replace("extruder","")|int %}
        {% set current_color = svars["t{current_tool_num}_color"]|default("")|lower %}

        # --- What was used on the previous toolchange ---
        {% set last_color = svars.last_used_color|default("")|lower %}

        # --- Load the purge amounts from your SP_Variables ---
        {% set same        = printer["gcode_macro SP_Variables"].same_color|float %}
        {% set light2dark  = printer["gcode_macro SP_Variables"].light_to_dark|float %}
        {% set dark2light  = printer["gcode_macro SP_Variables"].dark_to_light|float %}
        {% set default     = printer["gcode_macro SP_Variables"].default|float %}

        {% set purge_amount = default %}   # fallback

        {% if current_color == "" or last_color == "" %}
            M117 Color unknown → using default purge ({default}mm)
        {% elif current_color == last_color %}
            {% set purge_amount = same %}
            M117 Same color ({current_color}) → short purge ({purge_amount}mm)
        {% else %}
            # --- Very small list of colors that are clearly "light" ---
            {% set light_colors = ["white","silver","lime","yellow"] %}
            {% if last_color in light_colors and current_color not in light_colors %}
                {% set purge_amount = light2dark %}
                M117 Light→Dark ({last_color}→{current_color}) → {purge_amount}mm
            {% elif last_color not in light_colors and current_color in light_colors %}
                {% set purge_amount = dark2light %}
                M117 Dark→Light ({last_color}→{current_color}) → {purge_amount}mm
            {% else %}
                M117 Color change ({last_color}→{current_color}) → default {default}mm
            {% endif %}
        {% endif %}

        # --- Actual purge (fast line in the same place you already use) ---
        SAVE_GCODE_STATE NAME=smart_purge_state
        M83                                          ; relative extrusion
        G1 X300 Y5 F4000
        G1 Z0.5 F1500
        G1 X5 Y5 E{purge_amount} F2000
        G1 Z0.6 F1500
        G92 E0
        G1 Z3.0 F1500
        RESTORE_GCODE_STATE NAME=smart_purge_state
        M400

        # --- Update tracking variables so the next change knows what we just used ---
        SAVE_VARIABLE VARIABLE=last_used_color VALUE='"{current_color}"'
        SAVE_VARIABLE VARIABLE=last_used_tool  VALUE='{current_tool_num}'
    {% endif %}
