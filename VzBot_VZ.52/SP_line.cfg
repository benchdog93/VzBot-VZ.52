
#-------------------------------------
# VZ-Bot Vz.52 Smart Purge 
#-------------------------------------

[gcode_macro SP_Purge_Line]
description: Smart PETG purge line using tool→color + last_used_color
# Usage: SP_Purge_LINE TOOL=<0-10>
gcode:
    # --- TOOLCHANGE TRACKER (single-color mode only) ---
    {% set tracker = printer["gcode_macro _TOOLCHANGE_TRACKER"] %}
    {% set count = tracker.total_toolchanges|default(0)|int %}
    M117 Toolchange count = {count}

    # Only run purge when: single-color print (count==0)
    {% if count == 0 %}

        # --- REQUIRE TOOL=<n> ---
        {% if "TOOL" not in params %}
            {action_respond_info("ERROR: TOOL parameter required")}
            M117 Missing TOOL
        {% else %}
            {% set tool_idx = params.TOOL|int %}
        {% endif %}

        # --- RANGE CHECK FOR TOOL ---
        {% if tool_idx < 0 or tool_idx > 10 %}
            {action_respond_info("ERROR: TOOL must be 0–10")}
            M117 TOOL out of range
        {% else %}

            # --- Load purge constants from SP_Variables ---
            {% set sp = printer["gcode_macro SP_Variables"] %}
            {% set same_val    = sp.same_color|int %}
            {% set l2d_val     = sp.light_to_dark|int %}
            {% set d2l_val     = sp.dark_to_light|int %}
            {% set default_val = sp.default|int %}

            # --- Saved color information ---
            {% set sv = printer.save_variables.variables %}
            {% set color_var = "t" ~ tool_idx ~ "_color" %}
            {% set new_color  = sv[color_var]|default("") %}
            {% set last_color = sv.last_used_color|default("") %}

            # --- Light/dark color groups (fixed list) ---
            {% set LIGHT = ["white","silver","lime","yellow","orange","gold","marble","gray"] %}
            {% set DARK  = ["black","blue","green","chocolate","purple","red"] %}

            # --- Select purge length ---
            {% if last_color == "" or new_color == "" %}
                {% set purge_len = default_val %}
            {% elif last_color == new_color %}
                {% set purge_len = same_val %}
            {% elif last_color in DARK and new_color in LIGHT %}
                {% set purge_len = d2l_val %}
            {% elif last_color in LIGHT and new_color in DARK %}
                {% set purge_len = l2d_val %}
            {% else %}
                {% set purge_len = default_val %}
            {% endif %}

            {action_respond_info("PETG purge_len = " ~ purge_len|string)}
            M117 PETG purge_len={purge_len}

            # --- SAVE UPDATED COLOR STATE ---
            SAVE_VARIABLE VARIABLE=last_used_color VALUE='"{new_color}"'
            SAVE_VARIABLE VARIABLE=last_used_tool  VALUE='"{tool_idx}"'

            # ================================
            #   SAFE MULTI-LINE PURGE SYSTEM
            # ================================

            {% set X_MIN = 0 %}
            {% set X_MAX = 315 %}
            {% set Y_MIN = 0 %}
            {% set Y_MAX = 315 %}

            {% set X_SAFE_MAX = X_MAX - 2 %}
            {% set X_SAFE_MIN = X_MIN + 2 %}

            {% set Y1 = 5 %}
            {% set Y2 = 7 %}
            {% set Y3 = 9 %}

            {% set baseline = default_val|float %}
            {% set base_dx = 275.0 %}
            {% set base_e  = 75.0 %}
            {% set scale = purge_len / baseline %}

            {% set dx = base_dx * scale %}
            {% set e_val = base_e * scale %}

            # Clamp dx to machine limits
            {% if dx > (X_SAFE_MAX - X_SAFE_MIN) %}
                {% set dx = X_SAFE_MAX - X_SAFE_MIN %}
            {% endif %}

            {% set X_start = X_SAFE_MAX %}
            {% set X_end = X_start - dx %}
            {% if X_end < X_SAFE_MIN %}
                {% set X_end = X_SAFE_MIN %}
            {% endif %}

            {% set Xs = "%0.3f"|format(X_start) %}
            {% set Xe = "%0.3f"|format(X_end) %}
            {% set Ee = "%0.3f"|format(e_val) %}

            # How many lines?
            {% if purge_len <= 250 %}
                {% set lines = 1 %}
            {% elif purge_len <= 350 %}
                {% set lines = 2 %}
            {% else %}
                {% set lines = 3 %}
            {% endif %}

            # ----------------
            #   PURGE MOVES
            # ----------------
            # ----------------
            #   PURGE MOVES
            # ----------------
            G92 E0
            G90

            # ---- LINE 1 ---- (right -> left)
            G1 X{Xs} Y{Y1} F4000
            G1 Z0.5 F1500
            G1 X{Xe} Y{Y1} E{Ee} F2000
            G1 Z0.6 F1500

            {% if lines >= 2 %}
                # ---- LINE 2 ---- (left -> right, serpentine)
                ; start where line 1 ended in X, just move up in Y
                G1 X{Xe} Y{Y2} F4000
                G1 Z0.5 F1500
                G1 X{Xs} Y{Y2} E{Ee} F2000
                G1 Z0.6 F1500
            {% endif %}

            {% if lines >= 3 %}
                # ---- LINE 3 ---- (right -> left again)
                G1 X{Xs} Y{Y3} F4000
                G1 Z0.5 F1500
                G1 X{Xe} Y{Y3} E{Ee} F2000
                G1 Z0.6 F1500
            {% endif %}

            G92 E0
            G1 Z3.0 F1500
            M400
            G4 P500
            M117 Purge done

        {% endif %}   # tool range check

    {% else %}
        {action_respond_info("Purge skipped: multi-color print")}
        M117 Purge skipped
    {% endif %}

[gcode_macro TR_SMART_LOAD_TOOL]
description: Loads a tool through TradRack and runs the smart PETG purge sequence
# Usage:  TR_SMART_LOAD_TOOL TOOL=<0-10>
gcode:
    {% if "TOOL" not in params %}
        RESPOND PREFIX="TR_SMART_LOAD" MSG="ERROR: TOOL parameter required"
        M117 TR_SMART_LOAD: missing TOOL
    {% else %}
        {% set tool_idx = params.TOOL|int %}
        {% if tool_idx < 0 or tool_idx > 10 %}
            RESPOND PREFIX="TR_SMART_LOAD" MSG="ERROR: TOOL must be 0–10"
            M117 TR_SMART_LOAD: invalid TOOL
        {% else %}

            M117 Loading tool {tool_idx}

            # --- Load the requested tool using TradRack ---
            TR_LOAD_TOOLHEAD TOOL={tool_idx}

            # Wait for tool load completion
            M400

            # --- Run smart PETG purge logic ---
            M117 Purging PETG for tool {tool_idx}
            SP_Purge_Line TOOL={tool_idx}

            M117 Tool {tool_idx} ready

        {% endif %}
    {% endif %}
