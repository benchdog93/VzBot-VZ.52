
#-------------------------------------
# VZ-Bot Vz.52 Smart Purge 
#-------------------------------------

[gcode_macro SP_Purge_Line]
description: Smart PETG purge line using tool→color + last_used_color
# Usage: CALL SP_Purge_Line TOOL=<0-10>
gcode:
    # --- Get toolchange count ---
    {% set tracker = printer["gcode_macro _TOOLCHANGE_TRACKER"] %}
    {% set count = tracker.total_toolchanges|default(0)|int %}
    M117 Toolchange count = {count}

    # --- Only run in single-color mode ---
    {% if count == 0 %}

        # --- TOOL PARAM CHECK ---
        {% if "TOOL" not in params %}
            {action_respond_info("ERROR: TOOL parameter required")}
            M117 Missing TOOL

        {% else %}
            {% set tool_idx = params.TOOL|int %}

            # --- TOOL RANGE CHECK ---
            {% if not (tool_idx == 0 or tool_idx == 1 or tool_idx == 2 or tool_idx == 3 or tool_idx == 4 or tool_idx == 5 or tool_idx == 6 or tool_idx == 7 or tool_idx == 8 or tool_idx == 9 or tool_idx == 10) %}
                {action_respond_info("ERROR: TOOL must be 0–10")}
                M117 TOOL out of range

            {% else %}

                # --- PETG purge constants from SP_Variables ---
                {% set sp = printer["gcode_macro SP_Variables"] %}
                {% set same_val    = sp.variable_same_color|int %}
                {% set l2d_val     = sp.variable_light_to_dark|int %}
                {% set d2l_val     = sp.variable_dark_to_light|int %}
                {% set default_val = sp.variable_default|int %}

                # --- Saved variables: tool colors + last-used ---
                {% set sv = printer.save_variables.variables %}
                {% set color_var = "t" ~ tool_idx ~ "_color" %}
                {% set new_color = sv[color_var]|default("") %}
                {% set last_color = sv.last_used_color|default("") %}

                # --- Decide purge length ---
                {% if last_color == "" or new_color == "" %}
                    {% set purge_len = default_val %}
                {% elif last_color == new_color %}
                    {% set purge_len = same_val %}
                {% elif (last_color == "black" or last_color == "blue" or last_color == "green" or last_color == "chocolate" or last_color == "purple") and (new_color == "white" or new_color == "silver" or new_color == "lime" or new_color == "yellow" or new_color == "orange" or new_color == "red") %}
                    {% set purge_len = d2l_val %}
                {% elif (last_color == "white" or last_color == "silver" or last_color == "lime" or last_color == "yellow" or last_color == "orange" or last_color == "red") and (new_color == "black" or new_color == "blue" or new_color == "green" or new_color == "chocolate" or new_color == "purple") %}
                    {% set purge_len = l2d_val %}
                {% else %}
                    {% set purge_len = default_val %}
                {% endif %}

                {action_respond_info("Purge length chosen: " ~ purge_len|string)}
                M117 Purging PETG

                # --- Save updated state ---
                SAVE_VARIABLE VARIABLE=last_used_color VALUE='"{new_color}"'
                SAVE_VARIABLE VARIABLE=last_used_tool  VALUE='"{tool_idx}"'

                # --- Scale purge line motion ---
                {% set baseline = default_val|float %}
                {% set base_e = 75.0 %}
                {% set base_dx = 295.0 %}
                {% set scale = purge_len / baseline %}
                {% set e_val = base_e * scale %}
                {% set dx = base_dx * scale %}
                {% set new_x = 300.0 - dx %}
                {% set new_x_fmt = "%0.3f"|format(new_x) %}
                {% set e_val_fmt = "%0.3f"|format(e_val) %}
                {% if new_x < 5.0 %}
                    {% set new_x = 5.0 %}
                {% endif %}

                # --- Purge movement ---
                G92 E0
                G90
                G1 X300 Y5 F4000
                G1 Z0.5 F1500
                G1 X{new_x_fmt} Y5 E{e_val_fmt} F2000.0
                G1 Z0.6 F1500
                G92 E0
                G1 Z3.0 F1500
                M400
                G4 P500
                M117 Purge done

            {% endif %}    # closes tool-range-check IF #}
        {% endif %}        # closes TOOL param check #}

    {% else %}
        {action_respond_info("Purge skipped: multi-color print")}
        M117 Purge skipped
    {% endif %}            # closes count==0 #}
