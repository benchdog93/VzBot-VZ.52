
#=====================================
# VzBot-VZ.52 Fluidd Config 
#=====================================

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_Print

[pause_resume]

[display_status]

[respond] 
default_type: echo

[exclude_object]

[gcode_arcs]
resolution: 0.1

[save_variables]
filename: ~/printer_data/config/_globals.pvar

[firmware_retraction]

[idle_timeout]
#description: "Only turn off heaters and motors if the printer is not paused"
gcode:
    {% if not printer.pause_resume.is_paused %}
#       M117 Idle timeout: Turning off heaters and motors  ; Display message on screen
        TURN_OFF_HEATERS
        M84
    {% else %}
        M117 Printer is paused - keeping heaters on
    {% endif %}

[sdcard_loop]

[skew_correction]

[duplicate_pin_override]
pins: PC0, PG12

#[force_move]
#enable_force_move: True

#=====================================
# Cancel print
#=====================================

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    M117 Canceling print job...
    VZ_CANCELLED

#    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    SAVE_GCODE_STATE NAME=END_state

    {% if printer.toolhead.position.z|float + 50 >= printer.configfile.config["stepper_z"]["position_max"]|float %}
        G90                  
        G1 Z{printer.configfile.config["stepper_z"]["position_max"]|float} F1000 
    {% else %}

        G91                 
        G1 Z50 F600         
    {% endif %}

    {% if ('x' in printer.toolhead.homed_axes) and ('y' in printer.toolhead.homed_axes) %}

        G90 
        G1 X330 Y20 F24000
    {% endif %}
    
    BASE_CANCEL_PRINT
    BUTTON_UNLOAD_FILAMENT 
    M117 Print Cancelled!!!

    # === New: keep stats accurate after cancel ===
    {% if printer["gcode_macro _PRINT_STATS_VARS"] %}
        UPDATE_PRINT_STATS
    {% endif %}

#=====================================
# Pause print
#=====================================

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    M117 Print Paused - Press Resume
    VZ_PAUSED        ; Reset LCD color

    # Parameters
    {% set z = params.Z|default(20)|int %}  

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}  
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}  
        SAVE_GCODE_STATE NAME=PAUSE  
        BASE_PAUSE  

        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G91  
            G1 Z{z} F900  
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }  
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        
        G90  
        G1 X{printer.toolhead.axis_maximum.x/6} Y{printer.toolhead.axis_minimum.y+5} F6000  
        SAVE_GCODE_STATE NAME=PAUSEPARK  

        # === New: update stats & restart live display ===
        {% if printer["gcode_macro _PRINT_STATS_VARS"] %}
            UPDATE_PRINT_STATS
            UPDATE_DELAYED_GCODE NAME=UPDATE_DISPLAY DURATION=1
        {% endif %}
    {% endif %}
#======================================
# Resume print
#======================================

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
#    M117 Print Paused - Confirm to Resume
#    M300 S1200 P500  ; Beep to notify user

    # Wait for user confirmation to resume
#    PAUSE_CONFIRM  

    M117 Resuming Print...
    VZ_PRINTING       ; Reset LCD color

    # Parameters
    {% set e = params.E|default(1)|int %}  ; Hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        # SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1  ; Enable filament sensor if needed

        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; Restore original idle timeout

        {% if etemp > 0 %}
            M117 Heating hotend to {etemp|int}°C...
            M109 S{etemp|int}  ; Wait for hotend to heat back up
        {% endif %}

        M117 Returning to parked position...
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100  ; Move back to parked position

        G91  ; Relative positioning
        M83  ; Relative extruder positioning

        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            M117 Priming nozzle...
            G1 Z{zhop * -1} E{e} F900  ; Prime nozzle and lower Z back
        {% else %}
            M117 Lowering Z...
            G1 Z{zhop * -1} F900  ; Lower Z without priming
        {% endif %}

        M117 Restoring previous position...
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60  ; Restore print position
        BASE_RESUME  ; Resume print

    M117 Printing Resumed...

        # === New: update stats & restart live display ===
        {% if printer["gcode_macro _PRINT_STATS_VARS"] %}
            UPDATE_PRINT_STATS
            UPDATE_DELAYED_GCODE NAME=UPDATE_DISPLAY DURATION=1
        {% endif %}
    {% endif %}