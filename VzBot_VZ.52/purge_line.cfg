

# --- Purge Line Configuration ---
[gcode_macro PURGE_LINE]
description: Run purge line only for single-color prints (skip movement in multi-color)
gcode:
    {% set tracker = printer["gcode_macro _TOOLCHANGE_TRACKER"] %}
    {% set count = tracker.total_toolchanges|default(0)|int %}
    M117 Toolchange count = {count}
    # --- Only run purge for single-color (count == 0) ---
    {% if count == 0 %}
        M117 Running purge line (single color)
        M400
        G92 E0
        G90
        G1 X300 Y5 F4000
        G1 Z0.5 F1500
        G1 X5 Y5 E75.0 F2000.0
        G1 Z0.6 F1500
        G92 E0
        G1 Z3.0 F1500
        M400
        G4 P500
        M117 Purge line complete
    {% else %}
        # --- Multi-color: do NOTHING (no movement, minimal output) ---
        {action_respond_info("PURGE_LINE skipped: multi-color print")}
    {% endif %}
