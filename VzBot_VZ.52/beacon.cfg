
#========================================
# VZ-Bot Vz.52 Becon RevH Configuration
#========================================

# --- Beacon Setup ---
[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_D48BD0134E5737374D202020FF091A0F-if00
x_offset: 0 # update with offset from nozzle on your machine
y_offset: 15.065 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
contact_max_hotend_temperature: 180 # increase to probe at print temps
home_xy_position: 160, 135 # update with your safe position
home_z_hop: 5
home_z_hop_speed: 15
home_xy_move_speed: 300
#home_method: contact # use proximity for induction homing
#home_method_when_homed: proximity # after initial calibration use induction
#home_autocalibrate: unhomed # contact will calibrate beacon on first home
home_method: proximity
home_method_when_homed: proximity
home_autocalibrate: never

# --- Bed Calibrations ---
[gcode_macro BED_CALIBRATE]
gcode: 
    M190 S70
    M109 S150
#    CG28    # Home if required
    z_tilt_adjust RETRY_TOLERANCE=1  #tolerance (mm) when it starts to scane rather than probe
    z_tilt_adjust HORIZONTAL_MOVE_Z=2
    BED_MESH_CALIBRATE
    HEATERS_OFF

[gcode_macro BED_CALIBRATION]
gcode: 
    CG28    # Home if required
    z_tilt_adjust RETRY_TOLERANCE=1  #tolerance (mm) when it starts to scane rather than probe
    z_tilt_adjust HORIZONTAL_MOVE_Z=2
    BED_MESH_CALIBRATE
    HEATERS_OFF

# --- Z Cailabrations ----
[gcode_macro Z_TILT_SCAN]
gcode: 
    M190 S70
    M109 S150
    CG28    # Home if required
    z_tilt_adjust RETRY_TOLERANCE=1  #tolerance (mm) when it starts to scane rather than probe
    z_tilt_adjust HORIZONTAL_MOVE_Z=2
    HEATERS_OFF

[gcode_macro Z_HEIGHT]
gcode: 
    M117 Preaheating bed and extruder
    M190 S70
    M109 S150
    M117 Homing 
    CG28 
    M117 Calibrate Z 
    BEACON_AUTO_CALIBRATE
    M117 Tuen heaters off
    HEATERS_OFF
    M117 Park tool head 
    PARKING_POSITION
    M117 Z Height Calibration Finished
