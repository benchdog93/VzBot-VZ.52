
#--------------------------------------------------
# VZ-Bot Vz.52 Smart Purge - Tool/Color Selector
#--------------------------------------------------

# --- 1. ADD NEW COLOR ---
[gcode_macro ADD_NEW_COLOR]
description: Add new color – works with your exact '"list"' quoting style
gcode:
    {% set newcolor = params.COLOR|default("")|lower|trim %}
    {% if newcolor == "" %}
        M117 Usage: ADD_NEW_COLOR COLOR=yourcolor
    {% else %}
        {% set sv = printer.save_variables.variables %}

        # Your stored value is literally '"black,white,red"' (quotes included)
        {% set stored   = sv.colors_list|default('""') %}           # e.g. "black,white,red"
        {% set current  = stored|trim|trim('"') %}                  # → black,white,red

        {% set colors = current.split(",")|map('trim')|map('lower')|list %}

        {% if newcolor in colors %}
            M117 "{newcolor}" already exists
        {% else %}
            {% set newlist = current ~ "," ~ newcolor %}           # → black,white,red,test

            # THIS LINE MATCHES YOUR ORIGINAL STYLE EXACTLY
            SAVE_VARIABLE VARIABLE=colors_list VALUE='"{newlist}"'

            M117 Added "{newcolor}"
            M117 New list now has {colors|length + 1} colors
        {% endif %}
    {% endif %}

# 2. --- SET TOOL COLORS ---
[gcode_macro SET_TOOL_COLOR]
description: Smart: assign color to tool + auto-add new colors to master list
gcode:
    {% set TOOL_RAW = params.TOOL|default("")|string|trim %}
    {% set COLOR    = params.COLOR|default("")|string|lower|trim %}

    {% if COLOR == "" or TOOL_RAW == "" %}
        {action_respond_info("Please fill in both TOOL and COLOR")}
        M117 Missing TOOL or COLOR
    {% else %}
        {% set TOOL = TOOL_RAW|replace("t","")|replace("T","")|int %}
        {% if TOOL < 0 or TOOL > 10 %}
            M117 Tool must be 0–10
        {% else %}
            {% set clean_color = COLOR|lower|trim %}

            # Load current master list
            {% set current_list = printer.save_variables.variables.colors_list|default('""')|trim('"') %}
            {% set colors_array = current_list.split(",")|map('trim')|map('lower')|list %}

            # Add color if it's new
            {% if clean_color not in colors_array and clean_color != "" %}
                {% set new_master = current_list ~ "," ~ clean_color if current_list else clean_color %}
                SAVE_VARIABLE VARIABLE=colors_list VALUE='"{new_master}"'
                {action_respond_info("New color added to master list: " ~ clean_color)}
                M117 New color added: {clean_color}
            {% elif clean_color in colors_array %}
                M117 Color already known: {clean_color}
            {% endif %}

            # Always save the tool-specific color
            {% set var_name = "t" ~ TOOL ~ "_color" %}
            SAVE_VARIABLE VARIABLE={var_name} VALUE='"{clean_color}"'

            M117 T{TOOL} → {clean_color}
        {% endif %}
    {% endif %}