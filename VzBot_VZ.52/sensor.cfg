

######################################
# VZ-Bot Vz.52 Sensor
######################################

######################################
# Temperature
######################################

[temperature_sensor bed_saturation]
sensor_type: Generic 3950
pullup_resistor: 4700
sensor_pin: PF10 #Pin Location ADC_3

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor fly_mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

