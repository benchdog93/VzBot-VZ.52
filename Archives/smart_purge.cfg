
#=====================================
# VzBot VZ.52 – Persistent Smart Purge 
#=====================================

# smart_purge.cfg
# Clean, Klipper-compatible smart purge and tool-color manager for TradRack MMU (11 lanes).
# - Uses only valid variable names (variable_T0 .. variable_T10)
# - No gcode_metadata / action_form / parameter_* usage
# - Persistent variables saved with SAVE_VARIABLES
# - Simple, robust macros to set, show and use colors for purge logic
# - Adjust purge geometry/feeds at the top of this file to match your printer

# =========================
# User-configurable settings
# =========================
[gcode_macro SMART_PURGE_SETTINGS]
# Purge geometry / feedrates — edit these to match your printer / purge location
variable_PURGE_FEED: "1200"
variable_PURGE_TRAVEL_FEED: "3000"
variable_PURGE_BASE_MM: "150"
variable_PURGE_EXTRA_PER_LANE: "20"
variable_PURGE_EXTRUDE_MULT: "1.0"

# Purge line coordinates
variable_PURGE_START_X: "10"
variable_PURGE_START_Y: "10"
variable_PURGE_END_X: "190"
variable_PURGE_Z: "0.2"

gcode:
    # This macro only holds persistent variables; no commands needed.
    {action_respond_info("SMART_PURGE_SETTINGS loaded.")}

# =========================
# Persistent tool color table
# =========================
[gcode_macro TOOL_COLORS]
# Replace these initial values with the real colors loaded in each lane
variable_T0:  "black"
variable_T1:  "white"
variable_T2:  "lime"
variable_T3:  "red"
variable_T4:  "chocolate"
variable_T5:  "orange"
variable_T6:  "silver"
variable_T7:  "yellow"
variable_T8:  "purple"
variable_T9:  "green"
variable_T10: "blue"

# store last used tool index (string containing an integer)
variable_LAST_TOOL_PERSISTENT: "0"

gcode:
    # simple startup message to confirm variables loaded
    { action_respond_info("TOOL_COLORS: persistent color table loaded.") }

# =========================
# Set a single tool color (safe)
# Usage: SET_TOOL_COLOR TOOL=0 COLOR=red
# =========================
[gcode_macro SET_TOOL_COLOR]
description: "Set the color for a specific TradRack tool (persistent)"
gcode:
    {% set tool = params.TOOL|int %}
    {% if tool < 0 or tool > 10 %}
        { action_respond_info("SET_TOOL_COLOR: TOOL must be 0..10") }
    {% else %}
        {% set color = params.COLOR|string|default("unknown") %}
        {% set var = "variable_T" ~ tool %}
        SET_GCODE_VARIABLE MACRO=TOOL_COLORS VARIABLE={var} VALUE='"' ~ color ~ '"'
        SAVE_VARIABLES
        { action_respond_info("Tool " ~ tool ~ " color set to " ~ color) }
    {% endif %}

# =========================
# Show current mapping (prints to console / UI)
# Usage: SHOW_TOOL_COLORS
# =========================
[gcode_macro SHOW_TOOL_COLORS]
description: "Show current tool -> color mapping (persistent values)"
gcode:
    {% set out = [] %}
    {% for i in range(0,11) %}
        {% set var = "variable_T" ~ i %}
        {% set v = printer["gcode_macro TOOL_COLORS"][var]|default("unknown") %}
        {% set line = "T" ~ i ~ " = " ~ v %}
        {% set out = out + [line] %}
    {% endfor %}
    { action_respond_info(out|join("\n")) }

# =========================
# Internal helper: update LAST_TOOL_PERSISTENT
# Do not call directly unless you want to manually set last tool
# Usage: SET_LAST_TOOL TOOL=3
# =========================
[gcode_macro SET_LAST_TOOL]
description: "Set the stored last active tool index"
gcode:
    {% set tool = params.TOOL|int %}
    {% if tool < 0 or tool > 10 %}
        { action_respond_info("SET_LAST_TOOL: TOOL must be 0..10") }
    {% else %}
        SET_GCODE_VARIABLE MACRO=TOOL_COLORS VARIABLE=variable_LAST_TOOL_PERSISTENT VALUE='"' ~ tool ~ '"'
        SAVE_VARIABLES
        { action_respond_info("LAST_TOOL set to " ~ tool) }
    {% endif %}

# =========================
# Smart purge macro: PURGE_TO_TOOL
# Usage: PURGE_TO_TOOL NEW_TOOL=3
# - Looks up last tool (variable_LAST_TOOL_PERSISTENT)
# - Computes purge length if color changed
# - Moves to purge line and extrudes
# NOTE: You may want to adjust coordinates/feedrates above in SMART_PURGE_SETTINGS
# =========================
[gcode_macro PURGE_TO_TOOL]
description: "Purge filament when changing to NEW_TOOL (smart purge line)"
gcode:
    {% set new_tool = params.NEW_TOOL|int %}
    {% if new_tool < 0 or new_tool > 10 %}
        { action_respond_info("PURGE_TO_TOOL: NEW_TOOL must be 0..10") }
    {% else %}
        {% set last_tool = printer["gcode_macro TOOL_COLORS"]["variable_LAST_TOOL_PERSISTENT"]|default("0")|int %}
        {% set new_color = printer["gcode_macro TOOL_COLORS"]["variable_T" ~ new_tool]|default("unknown") %}
        {% set last_color = printer["gcode_macro TOOL_COLORS"]["variable_T" ~ last_tool]|default("unknown") %}

        {% if new_color == last_color %}
            # same color — minimal purge
            {% set base = printer["gcode_macro SMART_PURGE_SETTINGS"]["variable_PURGE_BASE_MM"]|default("80")|int %}
            {% set purge_mm = (base * 0.25)|int %}
            { action_respond_info("PURGE_TO_TOOL: colors are the same (" ~ new_color ~ "). Minimal purge: " ~ purge_mm ~ " mm") }
        {% else %}
            # different colors — compute purge
            {% set base = printer["gcode_macro SMART_PURGE_SETTINGS"]["variable_PURGE_BASE_MM"]|default("150")|int %}
            {% set extra = printer["gcode_macro SMART_PURGE_SETTINGS"]["variable_PURGE_EXTRA_PER_LANE"]|default("20")|int %}
            # crude "lanes difference" factor: abs(new_tool - last_tool)
            {% set lane_diff = (new_tool - last_tool)|abs %}
            {% set purge_mm = base + (extra * lane_diff) %}
            { action_respond_info("PURGE_TO_TOOL: changing " ~ last_color ~ " -> " ~ new_color ~ ". Purge: " ~ purge_mm ~ " mm") }
        {% endif %}

        # convert purge_mm to an extrusion amount (E). This is printer-specific.
        # We assume relative extrusion length equals purge_mm * extrude multiplier (user may need to tweak)
        {% set extrude_mult = printer["gcode_macro SMART_PURGE_SETTINGS"]["variable_PURGE_EXTRUDE_MULT"]|default("1.0")|float %}
        {% set e_amount = (purge_mm * extrude_mult)|round(3) %}

        # fetch coordinates and feeds
        {% set sx = printer["gcode_macro SMART_PURGE_SETTINGS"]["variable_PURGE_START_X"]|default("10") %}
        {% set sy = printer["gcode_macro SMART_PURGE_SETTINGS"]["variable_PURGE_START_Y"]|default("10") %}
        {% set ex = printer["gcode_macro SMART_PURGE_SETTINGS"]["variable_PURGE_END_X"]|default("190") %}
        {% set pz = printer["gcode_macro SMART_PURGE_SETTINGS"]["variable_PURGE_Z"]|default("0.2") %}
        {% set pf = printer["gcode_macro SMART_PURGE_SETTINGS"]["variable_PURGE_FEED"]|default("1200") %}

        # Move to safe Z, travel to start of purge line
        G28 ; home all axes (optional: comment out if you don't want an auto-home)
        G90
        G1 Z{pz} F{pf}
        G1 X{sx} Y{sy} F{printer["gcode_macro SMART_PURGE_SETTINGS"]["variable_PURGE_TRAVEL_FEED"]|default("3000")}

        # prime and run purge line: single long extrusion move from start to end
        G92 E0
        G1 F{pf}
        G1 X{ex} Y{sy} E{e_amount} ; purge line
        G92 E0

        # record the new tool as last tool
        SET_GCODE_VARIABLE MACRO=TOOL_COLORS VARIABLE=variable_LAST_TOOL_PERSISTENT VALUE='"' ~ new_tool ~ '"'
        SAVE_VARIABLES
        { action_respond_info("PURGE complete. LAST_TOOL set to " ~ new_tool) }
    {% endif %}

# =========================
# Quick command: CHANGE_TOOL
# Usage: CHANGE_TOOL TO=3
# This macro shows an example of changing to tool index TO and running PURGE_TO_TOOL
# Note: It does not perform the physical tool change on your MMU hardware.
# =========================
[gcode_macro CHANGE_TOOL]
description: "Convenience macro: call PURGE_TO_TOOL then set LAST_TOOL (does not do hardware tool-change)"
gcode:
    {% set to = params.TO|int %}
    {% if to < 0 or to > 10 %}
        { action_respond_info("CHANGE_TOOL: TO must be 0..10") }
    {% else %}
        PURGE_TO_TOOL NEW_TOOL={to}
        # if you have a hardware tool change command, add it here (example comment):
        # EXTRUDER_SWITCH TOOL={to}
    {% endif %}
