
# ------ flapper --------------------------------------------------- VzBot VZ.52 ----------------------------------------------------- stock ----------------------

[manual_stepper flap_stepper]
step_pin: PE4
dir_pin: !PG0
enable_pin: !PG1
microsteps: 16
rotation_distance: 1150
velocity: 4000
accel: 85000
endstop_pin: PD7

[tmc2240 manual_stepper flap_stepper]
cs_pin: PF15
interpolate: false
run_current: 0.8
hold_current: 0.6
spi_software_mosi_pin: PB5
spi_software_miso_pin: PB4
spi_software_sclk_pin: PB3

																[manual_stepper flap_stepper]
																step_pin: dp:PA1
																dir_pin: dp:PA0
																enable_pin: !dp:PA2
																microsteps: 16
																rotation_distance: 1150
																velocity: 4000
																accel: 85000
																homing_speed: 40
																endstop_pin: dp:PB3
																position_endstop: 0

																[tmc2209 manual_stepper flap_stepper]
																interpolate: false 
																uart_pin: dp:PC3
																run_current: 0.63
																hold_current: 0.4
																sense_resistor: 0.110


[fan_generic exhaust_fan]     [fan_generic exhaust_fan]
pin: PA3					  pin: rpi:gpio16
							  max_power: 1
							  cycle_time: 0.005
							  hardware_pwm: false
							  shutdown_speed: 0
							  off_below: 0.0

[fan]
#	Print Cooler Fan - FAN9 Connector
pin: PD15
hardware_pwm: false
max_power: 1
shutdown_speed: 0

# --- Flap Control Fan - gpio26 ---
[fan_generic exhaust_fan]
pin: rpi: gpio26
max_power: 1
cycle_time: 0.002
kick_start_time: 0.5
hardware_pwm: false
shutdown_speed: 0

																											
																															[fan]
																															##	Print Cooling Fan - PF8
																															pin: PF8
																															max_power: 1
																															cycle_time: 0.002
																															hardware_pwm: false
																															shutdown_speed: 0


[gcode_macro _SET_FLAP_ENABLED]
variable_enabled: 0
gcode:
    {% set enabled=params.ENABLED|int %}
	{% set flap_enabled=printer["gcode_macro _SET_FLAP_ENABLED"].enabled|int %}
	{% if enabled!=flap_enabled %}
		SET_GCODE_VARIABLE MACRO=_SET_FLAP_ENABLED VARIABLE=enabled VALUE={enabled}
		{% if enabled==1 %}
			MANUAL_STEPPER STEPPER=flap_stepper ENABLE=1
			MANUAL_STEPPER STEPPER=flap_stepper MOVE=-255 STOP_ON_ENDSTOP=1 SPEED=30
			MANUAL_STEPPER STEPPER=flap_stepper SET_POSITION=0
		{% else %}
			MANUAL_STEPPER STEPPER=flap_stepper MOVE=0
			MANUAL_STEPPER STEPPER=flap_stepper ENABLE=0
		{% endif %}
	{% endif %}

[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% if params.P is defined %}
        {% if params.P|int == 3 %}
            {% if params.S is defined %}
                {% if params.S|int == 255 %}
                    {% set realspeed = 1 %}
                {% else %}
                    {% if params.S|int == 0 %}
                        {% set realspeed = 0 %}
                    {% else %}
                        {% set realspeed = params.S|float/255 %}
                    {% endif %}
                {% endif %}
            {% else %}
                {% set realspeed = 1 %}
            {% endif %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED={realspeed}
		{% elif params.P|int == 1 %}
			_SET_FLAP_ENABLED ENABLED=1
			{% if params.S is defined %}
				MANUAL_STEPPER STEPPER=flap_stepper MOVE={params.S} SYNC=0
			{% else %}
				MANUAL_STEPPER STEPPER=flap_stepper MOVE=255 SYNC=0
			{% endif %}
		{% else %}
			M106.1 {rawparams}
        {% endif %}
    {% else %}
		_SET_FLAP_ENABLED ENABLED=1
        {% if params.S is defined %}
          MANUAL_STEPPER STEPPER=flap_stepper MOVE={params.S} SYNC=0
        {% else %}
          MANUAL_STEPPER STEPPER=flap_stepper MOVE=255 SYNC=0
        {% endif %}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
    {% if params.P is defined %}
		{% if params.P|int == 3 %}
			SET_FAN_SPEED FAN=exhaust_fan SPEED=0
		{% elif params.P|int == 2 %}
			M107.1 {rawparams}
		{% elif params.P|int == 1 %}
			MANUAL_STEPPER STEPPER=flap_stepper MOVE=0 SYNC=0
		{% endif %}      
    {% else %}
      SET_FAN_SPEED FAN=exhaust_fan SPEED=0
	  MANUAL_STEPPER STEPPER=flap_stepper MOVE=0 SYNC=0
	  _SET_FLAP_ENABLED ENABLED=0
      M107.1 {rawparams}
    {% endif %}

	