

#============================================
# VZ-Bot Vz.52 Printer Stats
#============================================

# Useful variables updated every status change or on demand
[gcode_macro _PRINT_STATS_VARS]
variable_print_state:       "standby"   # standby, printing, paused, complete, cancelled, error
variable_filament_used:     0.0         # mm of filament used in current print
variable_filament_total:    0.0         # mm estimated for whole print (from slicer)
variable_print_duration:    0           # seconds elapsed (only printing time, excludes pause)
variable_total_duration:    0           # seconds since PRINT_START (includes pauses)
variable_eta:               ""
variable_layer_current:     0
variable_layer_total:       0
variable_progress:          0.0         # 0-100%
variable_toolchanges:       0
gcode: 
    # This macro does nothing by itself — variables are updated by other macros below


# ------------------------------------------------------------------
# Update all stats — call this whenever you want fresh numbers
# ------------------------------------------------------------------
[gcode_macro UPDATE_PRINT_STATS]
description: Refresh all print statistics (safe to call anytime)
gcode:
    {% set ps = printer.print_stats %}
    {% set vc = printer.virtual_sdcard %}
    {% set idle = printer.idle_timeout %}

    # Detect current state
    {% set state = "standby" %}
    {% if ps.state|lower == "printing" %}
        {% set state = "printing" if not printer.pause_resume.is_paused else "paused" %}
    {% elif ps.state|lower == "complete" %} {% set state = "complete" %}
    {% elif ps.state|lower == "cancelled" %} {% set state = "cancelled" %}
    {% elif ps.state|lower == "error" %} {% set state = "error" %}
    {% endif %}

    # Filament used (Klipper tracks this natively since ~2023)
    {% set filament_used = ps.filament_used|default(0)|float %}

    # Print duration (only moving/extruding time)
    {% set print_duration = idle.printing_time|round(0) %}

    # Total time since start (includes pauses, heating, etc.)
    {% set total_duration = ps.print_duration|round(0) %}

    # Layer info (requires [print_stats] info total_layer/current_layer in slicer gcode)
    {% set layer_cur = ps.info.current_layer|default(0)|int %}
    {% set layer_tot = ps.info.total_layer|default(0)|int %}

    {% set toolchanges = printer["gcode_macro _TOOLCHANGE_TRACKER"].total_toolchanges|default(0)|int %}
    
    # Progress & ETA
    {% set progress = vc.progress|default(0)|float * 100 %}
    {% set eta = "unknown" %}
    {% if progress > 2 and print_duration > 60 %}
        {% set remaining = print_duration / (progress/100) - print_duration %}
        {% set eta = "%dh%02dm" % (remaining/3600, (remaining%3600)/60) %}
    {% endif %}

    # Store everything
    SET_GCODE_VARIABLE MACRO=_PRINT_STATS_VARS VARIABLE=print_state     VALUE="'{state}'"
    SET_GCODE_VARIABLE MACRO=_PRINT_STATS_VARS VARIABLE=filament_used   VALUE={filament_used}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATS_VARS VARIABLE=filament_total  VALUE={ps.info.total_filament|default(0)|float}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATS_VARS VARIABLE=print_duration  VALUE={print_duration}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATS_VARS VARIABLE=total_duration  VALUE={total_duration}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATS_VARS VARIABLE=layer_current   VALUE={layer_cur}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATS_VARS VARIABLE=layer_total     VALUE={layer_tot}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATS_VARS VARIABLE=progress        VALUE={progress}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATS_VARS VARIABLE=eta             VALUE="'{eta}'"
    SET_GCODE_VARIABLE MACRO=_PRINT_STATS_VARS VARIABLE=toolchanges     VALUE={toolchanges}


# ------------------------------------------------------------------
# Simple user-facing command — much better than your old GET_PRINT_STATS
# ------------------------------------------------------------------

[delayed_gcode UPDATE_DISPLAY]
gcode:
    {% if printer["gcode_macro _PRINT_STATS_VARS"].print_state in ["printing","paused"] %}
        UPDATE_PRINT_STATS
        {% set s = printer["gcode_macro _PRINT_STATS_VARS"] %}

        # Progress with one decimal place (e.g. 45.3%)
        {% set prog = "%.1f" % s.progress %}

        # SC or MC indicator
        {% set color = "MC" if s.toolchanges > 0 else "SC" %}

        # Layer display
        {% set layers = s.layer_current ~ "/" ~ (s.layer_total|default("?")) %}

        # Final clean M117 line – NO Python slicing!
        M117 {prog}% {color} {layers} {s.eta}

        UPDATE_DELAYED_GCODE NAME=UPDATE_DISPLAY DURATION=10
    {% else %}
        M117 Ready
    {% endif %}
initial_duration: 5


# ------------------------------------------------------------------
# Manual PRINT_STATS command – type it any time (FIXED)
# ------------------------------------------------------------------
[gcode_macro PRINT_STATS]
description: Show detailed current print statistics
gcode:
    UPDATE_PRINT_STATS
    {% set s = printer["gcode_macro _PRINT_STATS_VARS"] %}
    
    {% if s.print_state in ["printing","paused"] %}
        RESPOND MSG="Print: { '%.1f' % s.progress }% | Layer {s.layer_current}/{s.layer_total|default('?')}"
        RESPOND MSG="Filament: { '%.2f' % (s.filament_used/1000) }m used ({'%.1f' % (s.filament_used/s.filament_total*100) if s.filament_total else '?' }%)"
        RESPOND MSG="Toolchanges: {s.toolchanges} → {'MULTI-COLOR (purge skipped)' if s.toolchanges > 0 else 'SINGLE-COLOR (purge ran)'}"
        RESPOND MSG="Time: {'%d' % (s.print_duration/60)}min printing | {'%d' % (s.total_duration/60)}min total | ETA {s.eta}"
        {% if printer.pause_resume.is_paused %}
            RESPOND MSG="Print is PAUSED"
        {% endif %}

    {% elif s.print_state == "complete" %}
        RESPOND MSG="Print finished! Filament: {'%.2f' % (s.filament_used/1000)}m | Time: {'%d' % (s.total_duration/60)}min"

    {% else %}
        RESPOND MSG="No active print ({s.print_state})"
    {% endif %}



