# --- Hot End Fan Configuration ---
[gcode_macro HOTEND_FAN_CHECK]
variable_he_stop_count: 0
variable_fan_name: "hotend_fan"
gcode:
    {% set min_rpm = 500|float %}
    {% set max_consecutive_stops = 10 %}

    {% set fan_name = printer["gcode_macro HOTEND_FAN_CHECK"].fan_name %}
    {% set fan = printer['heater_fan ' + fan_name] %}
    {% set rpm = (fan.rpm|default(0))|float %}
    {% set he_target = printer[printer.toolhead.extruder].target|float %}
    {% set he_temp = printer[printer.toolhead.extruder].temperature|float %}
    {% set fan_on_temp = printer.configfile.settings['heater_fan ' + fan_name].heater_temp|float %}
    {% set he_stop_count = printer["gcode_macro HOTEND_FAN_CHECK"].he_stop_count|int %}

    {% if (he_target >= fan_on_temp) and (rpm < min_rpm) and (he_temp >= fan_on_temp + 5) %}
        {% set new_count = he_stop_count + 1 %}
        SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=he_stop_count VALUE={new_count}
        M118 WARNING: Fan stoppage detected ({new_count}/{max_consecutive_stops}).
        M400
        {% if new_count >= max_consecutive_stops %}
            FAN_STOPPAGE_ROUTINE
        {% endif %}
    {% else %}
        SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=he_stop_count VALUE=0
    {% endif %}

# --- Hot End Fan Debug ---
[gcode_macro HOTEND_FAN_RPM_DEBUG]
gcode:
    {% set fan = printer['heater_fan hotend_fan'] %}
    {% set rpm = fan.rpm|default(0)|float %}
    M118 HOTEND_FAN_RPM={rpm}

# --- Hot End Fan Routine ---
[gcode_macro FAN_STOPPAGE_ROUTINE]
description: Triggered when hotend fan fails multiple checks
gcode:
    M118 ⚠️ FAN FAILURE DETECTED! Hotend fan not spinning.
    M117 ⚠️ FAN FAILURE — HEATERS DISABLED
    M400

    # Disable all heaters immediately
    TURN_OFF_HEATERS

    # Optional: park the toolhead safely
    {% if 'toolhead' in printer %}
        G91                     ; relative move
        G1 Z10 F600             ; lift nozzle
        G90                     ; absolute move
        G1 X45 Y45 F6000          ; move to corner (safe position)
    {% endif %}

    # Optional: turn on case LEDs red if defined
    VZ_CANCELLED

    # Pause the print if running
    {% if printer.print_stats.state == "printing" %}
        PAUSE
    {% endif %}

    # Log to console
    {action_respond_info("FAN_STOPPAGE_ROUTINE executed: heaters disabled, print paused.")}

# --- Monitoring loop. Begins at Klipper start ---
[delayed_gcode CHECK_ALL_FANS]
initial_duration: 1
gcode:
    HOTEND_FAN_CHECK
    UPDATE_DELAYED_GCODE ID=CHECK_ALL_FANS DURATION=3
