######################################
# VzBot-VZ.52 Klipper Config 
######################################

######################################
# Include 
######################################

[include VzBot VZ.52/*.cfg]

######################################
# printer
######################################

[printer]
kinematics: limited_corexy
max_velocity: 1000
max_accel: 55000
#max_accel_to_decel: 60000
max_x_accel: 30640
max_y_accel: 14510
scale_xy_accel: false
max_z_velocity: 10
max_z_accel: 50

######################################
# MCU
######################################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_1C003F000F51323137343334-if00
#restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[mcu tr]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6625495535D9539-if00

[mcu dp]
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_1A002E000957464234373220-if00

